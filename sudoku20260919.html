<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数独 (Sudoku)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #f5f6f8;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px 8px;
    min-height: 100vh;
  }
  .app-container {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
  }
  h1 { font-size: 1.3rem; font-weight: bold; color: #1a2530; }
  .timer-box {
    font-size: 1.1rem;
    font-weight: bold;
    color: #d97706;
    background: #fff;
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
  }
  /* 9x9方眼ボード */
  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    width: 100%;
    aspect-ratio: 1 / 1;
    background-color: #fff;
    border: 3px solid #2d3748;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  }
  .cell {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.35rem;
    font-weight: 500;
    cursor: pointer;
    border-right: 1px solid #e2e8f0;
    border-bottom: 1px solid #e2e8f0;
    color: #2b6cb0; /* 入力数字：藍系 */
  }
  /* 3x3ブロック境界 */
  .cell[data-col="2"], .cell[data-col="5"] { border-right: 2px solid #2d3748; }
  .cell[data-row="2"], .cell[data-row="5"] { border-bottom: 2px solid #2d3748; }
  .cell[data-col="8"] { border-right: none; }
  .cell[data-row="8"] { border-bottom: none; }

  /* セル状態 */
  .cell.fixed { font-weight: bold; color: #1a202c; cursor: default; } /* 固定数字 */
  .cell.selected { background-color: #ebf8ff; } /* 選択 */
  .cell.error { background-color: #fed7d7; color: #e53e3e; } /* 重複エラー */
  
  .message-area {
    min-height: 24px;
    text-align: center;
    font-weight: bold;
    font-size: 0.95rem;
    color: #4a5568;
  }
  .message-area.error-text { color: #e53e3e; }
  .message-area.success-text { color: #2f855a; }

  /* 入力キーパッド */
  .keypad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .key-btn {
    background: #fff;
    border: 1px solid #cbd5e0;
    border-radius: 6px;
    padding: 10px 0;
    font-size: 1.1rem;
    font-weight: bold;
    color: #2d3748;
    cursor: pointer;
    touch-action: manipulation;
  }
  .key-btn:active { background: #edf2f7; }
  .key-btn.action-btn { font-size: 0.9rem; color: #4a5568; background: #edf2f7; }

  /* 操作コントロール */
  .controls {
    display: flex;
    gap: 8px;
  }
  .ctrl-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 0.95rem;
    cursor: pointer;
    background: #4a5568;
    color: #fff;
  }
  .ctrl-btn.check-btn { background: #3182ce; }
  .ctrl-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>数独 (Sudoku)</h1>
    <div class="timer-box" id="timer">00:00.0</div>
  </header>

  <div class="board" id="board"></div>

  <div class="message-area" id="message"></div>

  <div class="keypad">
    <button class="key-btn" data-val="1">1</button>
    <button class="key-btn" data-val="2">2</button>
    <button class="key-btn" data-val="3">3</button>
    <button class="key-btn" data-val="4">4</button>
    <button class="key-btn" data-val="5">5</button>
    <button class="key-btn" data-val="6">6</button>
    <button class="key-btn" data-val="7">7</button>
    <button class="key-btn" data-val="8">8</button>
    <button class="key-btn" data-val="9">9</button>
    <button class="key-btn action-btn" data-val="0">消去</button>
  </div>

  <div class="controls">
    <button class="ctrl-btn check-btn" id="check-btn">答え合わせ</button>
    <button class="ctrl-btn" id="share-btn">結果共有</button>
  </div>
</div>

<script>
(function() {
  // 初期盤面データ (0は空欄)
  const INITIAL = [
    2, 8, 0, 0, 0, 0, 0, 5, 3,
    0, 0, 0, 2, 8, 9, 0, 0, 0,
    9, 0, 0, 0, 1, 0, 0, 0, 6,
    0, 3, 0, 0, 0, 0, 0, 8, 0,
    0, 0, 0, 9, 2, 7, 0, 0, 0,
    0, 6, 0, 0, 0, 0, 0, 9, 0,
    4, 0, 0, 0, 3, 0, 0, 0, 9,
    0, 0, 0, 6, 4, 1, 0, 0, 0,
    6, 1, 0, 0, 0, 0, 0, 7, 5
  ];

  const state = {
    grid: [...INITIAL],
    selectedIndex: null,
    errors: new Set(),
    isCleared: false,
    startTime: null,
    timerId: null,
    clearTimeText: ""
  };

  const boardEl = document.getElementById('board');
  const timerEl = document.getElementById('timer');
  const messageEl = document.getElementById('message');
  const checkBtn = document.getElementById('check-btn');
  const shareBtn = document.getElementById('share-btn');
  const cells = [];

  // 1. DOM初期構築 (一度だけ作成)
  function initBoard() {
    for (let i = 0; i < 81; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const r = Math.floor(i / 9);
      const c = i % 9;
      cell.dataset.row = r;
      cell.dataset.col = c;
      if (INITIAL[i] !== 0) cell.classList.add('fixed');
      
      cell.addEventListener('click', () => {
        if (state.isCleared) return;
        state.selectedIndex = i;
        render();
      });
      boardEl.appendChild(cell);
      cells.push(cell);
    }
  }

  // タイマー機能
  function startTimer() {
    state.startTime = performance.now();
    state.timerId = setInterval(() => {
      if (state.isCleared) return;
      const elapsed = (performance.now() - state.startTime) / 1000;
      const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
      const s = Math.floor(elapsed % 60).toString().padStart(2, '0');
      const d = Math.floor((elapsed % 1) * 10);
      state.clearTimeText = `${m}:${s}.${d}`;
      timerEl.textContent = state.clearTimeText;
    }, 100);
  }

  // 重複チェック（リアルタイム検出用）
  function validateDuplicates() {
    const errorIndices = new Set();
    const checkGroup = (indices) => {
      const seen = {};
      indices.forEach(idx => {
        const val = state.grid[idx];
        if (val !== 0) {
          if (seen[val] !== undefined) {
            errorIndices.add(seen[val]);
            errorIndices.add(idx);
          } else {
            seen[val] = idx;
          }
        }
      });
    };

    // 行・列チェック
    for (let i = 0; i < 9; i++) {
      checkGroup(Array.from({length: 9}, (_, k) => i * 9 + k));
      checkGroup(Array.from({length: 9}, (_, k) => k * 9 + i));
    }
    // 3x3ブロックチェック
    for (let br = 0; br < 3; br++) {
      for (let bc = 0; bc < 3; bc++) {
        const blockIndices = [];
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            blockIndices.push((br * 3 + r) * 9 + (bc * 3 + c));
          }
        }
        checkGroup(blockIndices);
      }
    }
    return errorIndices;
  }

  // 2. 状態更新とレンダリング
  function render() {
    state.errors = validateDuplicates();

    for (let i = 0; i < 81; i++) {
      const cell = cells[i];
      const val = state.grid[i];
      cell.textContent = val !== 0 ? val : '';

      // スタイル状態リセット・再設定
      cell.classList.toggle('selected', state.selectedIndex === i);
      cell.classList.toggle('error', state.errors.has(i));
    }
  }

  // 入力処理
  function handleInput(val) {
    if (state.isCleared || state.selectedIndex === null) return;
    if (INITIAL[state.selectedIndex] !== 0) return; // 固定セルの変更禁止

    state.grid[state.selectedIndex] = val;
    render();
  }

  // 答え合わせ (ルールベース: 空白なし + 重複なし)
  function checkAnswer() {
    if (state.isCleared) return;

    if (state.grid.includes(0)) {
      messageEl.textContent = '未入力のマスがあります。';
      messageEl.className = 'message-area error-text';
      return;
    }

    if (state.errors.size > 0) {
      messageEl.textContent = '誤りがあります。';
      messageEl.className = 'message-area error-text';
      return;
    }

    // 正解処理
    state.isCleared = true;
    clearInterval(state.timerId);
    messageEl.textContent = `正解です！ クリアタイム: ${state.clearTimeText}`;
    messageEl.className = 'message-area success-text';
    state.selectedIndex = null;
    render();
  }

  // 画像生成 (共有用 Canvas)
  function generateBoardCanvas() {
    const canvas = document.createElement('canvas');
    const size = 360;
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);

    const cellSize = size / 9;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '20px sans-serif';

    for (let i = 0; i < 81; i++) {
      const r = Math.floor(i / 9);
      const c = i % 9;
      const x = c * cellSize;
      const y = r * cellSize;
      const val = state.grid[i];

      // セル背景・線
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, cellSize, cellSize);

      if (val !== 0) {
        ctx.fillStyle = INITIAL[i] !== 0 ? '#1a202c' : '#2b6cb0';
        ctx.fillText(val.toString(), x + cellSize / 2, y + cellSize / 2);
      }
    }

    // 3x3ブロック太線
    ctx.strokeStyle = '#2d3748';
    ctx.lineWidth = 3;
    for (let i = 0; i <= 9; i += 3) {
      ctx.beginPath();
      ctx.moveTo(i * cellSize, 0);
      ctx.lineTo(i * cellSize, size);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * cellSize);
      ctx.lineTo(size, i * cellSize);
      ctx.stroke();
    }

    return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  }

  // 共有機能
  async function shareResult() {
    const shareText = state.isCleared
      ? `数独をクリアしました！ クリアタイム: ${state.clearTimeText}`
      : `数独をプレイ中！ タイム: ${state.clearTimeText}`;

    const blob = await generateBoardCanvas();
    const file = new File([blob], 'sudoku-result.png', { type: 'image/png' });

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          title: '数独 クリア結果',
          text: shareText,
          files: [file]
        });
      } catch (e) {
        // ユーザーキャンセル時は何もしない
      }
    } else {
      // フォールバック (クリップボードコピー & 画像ダウンロード)
      try {
        await navigator.clipboard.writeText(shareText);
        alert('結果メッセージをクリップボードにコピーしました。\n画像を保存します。');
      } catch (e) {
        alert(shareText);
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sudoku-result.png';
      a.click();
    }
  }

  // イベントリスナー設定
  document.querySelectorAll('.key-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      handleInput(parseInt(btn.dataset.val, 10));
    });
  });

  window.addEventListener('keydown', (e) => {
    if (state.isCleared) return;
    if (e.key >= '1' && e.key <= '9') handleInput(parseInt(e.key, 10));
    else if (e.key === '0' || e.key === 'Backspace' || e.key === 'Delete') handleInput(0);
  });

  checkBtn.addEventListener('click', checkAnswer);
  shareBtn.addEventListener('click', shareResult);

  // 初期化実行
  initBoard();
  startTimer();
  render();
})();
</script>
</body>
</html>
